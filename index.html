<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CBE Premium</title>
  
  <!-- PWA Connections -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./boa.png" type="image/png" />
  <link rel="apple-touch-icon" href="./boa.png" />
  
  <!-- Styling Meta Tags for Standalone Mobile Execution -->
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN to render the component's utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-slate-100 antialiased m-0 p-0">

  <!-- React Root Container Matrix -->
  <div id="root"></div>

  <!-- Direct Connection to your React component logic file -->
  <script type="module" src="./AskeletonBOA.js"></script>

  <!-- Service Worker Handler for Home Screen Installation Trigger -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA installation vector active. Scope:', reg.scope))
          .catch(err => console.error('PWA installation vector initialization failed:', err));
      });
    }
  </script>
</body>
</html>
